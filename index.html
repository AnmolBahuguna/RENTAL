<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="GoEazy is the premier platform for finding and listing Rooms, PGs, and Hostels. Easy, verified, and student-friendly housing solutions in Dehradun and beyond." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Console Cleanup & Permissions Policy -->
    <meta http-equiv="Permissions-Policy" content="accelerometer=(self), gyroscope=(self), magnetometer=(self), camera=(), microphone=(), geolocation=()">
    <script>
      (function() {
        const ignoreStrings = [
          'non-passive event listener',
          'accelerometer is not allowed',
          'devicemotion events are blocked',
          'deviceorientation events are blocked',
          'unsafe header',
          'x-rtb-fingerprint-id',
          'Permissions policy violation',
          'Forced reflow',
          'Mixed Content',
          'local network request',
          'request-id',
          'accelerometer'
        ];
        const originalWarn = console.warn;
        const originalError = console.error;
        const originalLog = console.log;
        
        const shouldIgnore = (args) => {
          return args.some(arg => 
            typeof arg === 'string' && ignoreStrings.some(s => arg.includes(s))
          );
        };

        console.warn = function(...args) {
          if (shouldIgnore(args)) return;
          originalWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (shouldIgnore(args)) return;
          originalError.apply(console, args);
        };
        console.log = function(...args) {
          if (shouldIgnore(args)) return;
          originalLog.apply(console, args);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
